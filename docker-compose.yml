version: "3.9"

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "5009:8001"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: http://45.13.59.233:5009
    restart: unless-stopped
    ports:
      - "3011:80"
    depends_on:
      - backend