services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "5009:8001"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: https://api.theicen.org   # ✅ FIXED
    restart: unless-stopped
    ports:
      - "3011:80"
    depends_on:
      - backend